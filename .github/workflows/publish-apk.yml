name: Publish prepared APK

on:
  push:
    branches: [apk-delivery, 'apk-delivery-*', 'ccr-*']
    paths: [delivery/READY, 'delivery/*/READY']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag staged in delivery/<tag>/ (empty: newest staged delivery)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -m pip install --quiet bsdiff4==1.2.6
          python3 scripts/restore_delivery.py --out "$RUNNER_TEMP" --tag "${{ inputs.tag }}" >> "$GITHUB_ENV"
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$APK_PATH" "$APK_PATH.sha256" --repo "$GITHUB_REPOSITORY" --clobber
